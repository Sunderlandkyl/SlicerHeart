# Builds, tests and publishes this extension against the Slicer nightly. How
# is in the workflow Slicer provides; this says when, and what it may do.
name: Build against the Slicer nightly
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (default: all)"
      # To try a branch that does not have this workflow; not published.
      source-ref:
        description: "Branch, tag or commit to build instead of this branch"
      source-repository:
        description: "Repository of that branch (default: this one)"
jobs:
  build:
    permissions:
      contents: write
    # On Slicer/Slicer: Slicer/Slicer/.github/workflows/extension-build.yml@main,
    # without slicer-repository and slicer-ref.
    uses: Sunderlandkyl/Slicer/.github/workflows/extension-build.yml@ci/github-actions-build
    with:
      publish: true
      source-ref: ${{ inputs.source-ref }}
      source-repository: ${{ inputs.source-repository }}
      slicer-repository: Sunderlandkyl/Slicer
      slicer-ref: ci/github-actions-build
